<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle Mountain / Cross-country terrain silhouettes -->
  <path d="M 0 380 Q 130 310 260 360 T 512 340 L 512 512 L 0 512 Z" fill="#312e81" opacity="0.6"/>
  <path d="M 0 420 Q 160 360 320 410 T 512 390 L 512 512 L 0 512 Z" fill="#1e1b4b" opacity="0.9"/>

  <!-- Golden Ring / Sun Accent -->
  <circle cx="360" cy="150" r="55" fill="url(#goldGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Dynamic Runner Silhouette (White with Gold Accent) -->
  <g filter="url(#glow)">
    <!-- Head -->
    <circle cx="285" cy="135" r="28" fill="#ffffff" />
    
    <!-- Torso & Motion -->
    <path d="M 270 170 L 225 255 L 255 265 L 290 200 Z" fill="#ffffff" />
    
    <!-- Forward Arm -->
    <path d="M 280 180 L 335 210 L 370 195" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Back Arm -->
    <path d="M 255 190 L 205 185 L 180 220" stroke="#fcd34d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Front Leg -->
    <path d="M 230 255 L 305 320 L 340 395" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Back Leg / Kick -->
    <path d="M 245 255 L 175 285 L 130 250" stroke="#fcd34d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Finish ribbon / motion lines -->
    <path d="M 90 315 L 140 315" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <path d="M 60 340 L 125 340" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <path d="M 85 365 L 150 365" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Trophy Emblem Badge at bottom -->
  <g transform="translate(256, 445)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#0f172a" opacity="0.8" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="0" y="7" font-family="'Cairo', sans-serif, system-ui" font-size="20" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">العدو الريفي</text>
  </g>
</svg>
